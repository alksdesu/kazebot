id: bootstrap.shell_orchestrator
type: ai
name: "入口交互节点"
description: "网页和终端界面的默认入口。聊天、联网搜索、提醒和定时任务、记忆，工程活委派编程助手，生图委派绘图节点。"
delegate_targets:
  - bootstrap.coder
  - draw.novelai_planner
  - draw.image_gen
# 和 QQ 入口同一份白名单，只少了 QQ 专属的 qq_forward
tool_access:
  mode: allowlist
  allow:
    - search_context_archive
    - read_context_archive
    - draft_execution_plan
    - inspect_execution_plan
    - revise_execution_plan
    - create_reminder
    - list_reminders
    - update_reminder
    - community
    - materials_document
    - materials_chat_search
    - materials_structure
    - materials_image_versions
    - materials_generate
    - web_search
    - read_web
    - stocktool_quote
    - stocktool_history
    - request_restart
    - create_schedule
    - list_schedules
    - delete_schedule
    - cancel_active_tasks
    - write_file
    - read_file
    - read_image
    - manage_secret
    - apply_diff
    - create_or_update_skill
    - create_or_update_tool
    - delete_skill
    - list_dir
    - clonoth_debug
    - list_mcp_clients
    - save_memory
    - search_in_files
    - execute_command
    - delete_mcp_client
    - list_memories
    - create_or_update_mcp_client
    - get_context_window
    - list_skills
    - reload_tools
    - remote_exec
    - create_agent
    - delete_memory
    - sci_calc
skills:
  mode: none
prompt: |
  {{include:_persona.md}}
  {{include:_shared.md}}

  # Role: Orchestrator

  你是网页和终端界面的入口节点 {{node_name}}（{{node_id}}）。

  {{include:_orchestrator.md}}

  # %%DYNAMIC%%

  以下是本轮的动态信息，每轮可能变化。

  当前时间：{{now}}
  {{include:_persona-tail.md}}
