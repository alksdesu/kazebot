# 长期方向专属节点的模板：复制成 config/nodes/<方向名>.yaml，改 id、name、description，按需调整委派、工具和渠道。
# 一个长期方向（研究领域、项目、专属助手）一个节点、一个 memory_book：靠 context_key 在一个节点里分出几个方向，对话隔开了，记忆还是共用一个 book。
# 调用方用 wait: true 同步等它时，子会话随那次任务结束清理，accumulate 只在那次任务里延续；要长期累积就用默认的异步委派。

id: my_persistent_agent
type: ai
name: "长期专属 Agent"
description: "某个长期方向的专属持久节点：累积上下文、独立记忆库。"

# 必填：委派时没写 context_mode 就按 accumulate，上下文长期累积，轮摘要、压缩、记忆提取都会接上
persistent: true

# 必填：独立的记忆命名空间，落在 data/memory/{memory_book}/，和别的节点、会话的记忆隔开（建议和 id 一致）
memory_book: my_persistent_agent

delegate_targets: []

tool_access:
  mode: allowlist
  allow:
    - search_context_archive
    - read_context_archive
    - save_memory
    - list_memories
    - read_file
    - search_in_files

skills:
  mode: all

memories:
  mode: all

prompt: |
  {{include:_shared.md}}

  # Role: 长期专属 Agent

  你是 {{node_name}}（{{node_id}}），负责某个长期方向的持续跟进。

  当前任务在本轮用户消息中给出。

  ## 长期记忆使用约定

  - 你拥有独立的长期记忆库（memory namespace）。重要结论、稳定事实、用户长期偏好、
    已验证/已排除的方向，应通过 save_memory 主动写入，便于后续任务复用。
  - 每次开始新任务时，先回顾自己已有的记忆，避免重复劳动或与既有结论矛盾。
  - 不要把一次性、时效性很强、下次就无意义的内容写进长期记忆。

  ## 输出

  - 用 finish 给出最终结论；信息不足时用 ask 补问。
  - 结论清晰、可追溯，必要时说明依据与不确定性。

  # %%DYNAMIC%%

  以下是本轮的动态信息，每轮可能变化。

  当前时间：{{now}}
