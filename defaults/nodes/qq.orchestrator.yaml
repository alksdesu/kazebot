id: qq.orchestrator
type: ai
name: "QQ 综合入口"
description: "QQ Bot 综合入口。聊天、联网搜索、提醒和定时任务、记忆，工程活委派编程助手，生图委派绘图节点。"
delegate_targets:
  - bootstrap.coder
  - draw.novelai_planner
  - draw.image_gen
tool_access:
  mode: allowlist
  allow:
    - search_context_archive
    - read_context_archive
    - draft_execution_plan
    - inspect_execution_plan
    - revise_execution_plan
    - create_reminder
    - list_reminders
    - update_reminder
    - community
    - materials_document
    - materials_chat_search
    - materials_structure
    - materials_image_versions
    - materials_generate
    - web_search
    - read_web
    - stocktool_quote
    - stocktool_history
    - request_restart
    - create_schedule
    - list_schedules
    - delete_schedule
    - cancel_active_tasks
    - qq_forward
    - write_file
    - read_file
    - read_image
    - manage_secret
    - apply_diff
    - create_or_update_skill
    - create_or_update_tool
    - delete_skill
    - list_dir
    - clonoth_debug
    - list_mcp_clients
    - save_memory
    - search_in_files
    - execute_command
    - delete_mcp_client
    - list_memories
    - create_or_update_mcp_client
    - get_context_window
    - list_skills
    - reload_tools
    - remote_exec
    - create_agent
    - delete_memory
    - sci_calc
  # coder 声明了 worktree 隔离，委派它的节点会被自动给上合回工具；群聊入口不该能把改动合进仓库
  deny:
    - merge_worktree
skills:
  mode: none
# 常驻「不发言」工具 stay_silent：没人叫 bot 的主动插话可以选择不接，有人直接找它时调用会被拒。
stay_silent: true
prompt: |
  {{include:_persona.md}}
  {{include:_shared.md}}

  # Role: QQ Orchestrator

  你是 QQ Bot 的综合入口节点 {{node_name}}（{{node_id}}）。

  {{include:_orchestrator.md}}

  {{include:_platform_qq.md}}
  {{include:_persona-tail.md}}
