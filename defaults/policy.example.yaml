# Clonoth policy configuration
# Copy to config/policy.yaml to override defaults.
#
# 命令安全采用双层机制：
# 1. cmd_reviewer 节点做 AI 前置审核。
# 2. Supervisor 继续做人类审批与硬规则兜底。
#
# AI 审核不能替代人类审批。
#
# 各平台声明的密钥文件（读写都拒）和平台自己维护的状态文件（拒写）不用写在这里：
# supervisor 按平台描述把它们排在所有规则前面，改这份文件也放不开。
# 挪进 config/ 的几份配置在判定时还认原来的名字：给 data/config.yaml、skills/** 这些旧路径
# 写的规则照样护住 config/models.yaml、config/skills/**，几个名字取最严的那条。

version: 1

extra_roots:
  - /opt/kazebot

read_file:
  default: auto
  rules:
    - pattern: "/opt/kazebot"
      decision: approval_required
      reason: "code directory is outside the instance workspace"
    - pattern: "/opt/kazebot/**"
      decision: approval_required
      reason: "code directory is outside the instance workspace"
    - pattern: ".env"
      decision: deny
      reason: "do not allow reading dotenv secrets"
    - pattern: "**/.env"
      decision: deny
      reason: "do not allow reading dotenv secrets"
    - pattern: "config/secrets.env"
      decision: deny
      reason: "do not allow reading shared dotenv secrets"
    # manage_secret 的虚拟路径，不是真目录；list 只回键名与是否已配，不回值。
    - pattern: ".secret"
      decision: auto
      reason: "listing secret names exposes no values"
    - pattern: "config/nodes/**"
      decision: deny
      reason: "node prompts are internal"
    # 仓库自带的默认节点，实例没改过的那几份就读它。
    - pattern: "defaults/nodes/**"
      decision: deny
      reason: "node prompts are internal"
    - pattern: "engine/system_nodes/**"
      decision: deny
      reason: "system prompts are internal"
    - pattern: "config/models.yaml"
      decision: approval_required
      reason: "model channels may hold api keys in plaintext"
    - pattern: "config/mcp.yaml"
      decision: approval_required
      reason: "mcp clients may carry tokens in env or headers"
    - pattern: "config/policy.yaml"
      decision: approval_required
      reason: "policy exposes the shape of every guard"
    - pattern: "config/drawtools/settings.yaml"
      decision: approval_required
      reason: "drawtools settings may hold the NovelAI api key"
    # data/ 下有平台密钥、.admin_token、会话与事件流。落到 default:auto 等于任何人问一句就能把密钥读出来。
    - pattern: "data/**"
      decision: approval_required
      reason: "runtime data may contain secrets or private context"

write_file:
  default: auto
  rules:
    - pattern: "/opt/kazebot"
      decision: approval_required
      reason: "code directory changes require approval"
    - pattern: "/opt/kazebot/**"
      decision: approval_required
      reason: "code directory changes require approval"
    - pattern: "tools/**"
      decision: approval_required
      reason: "creating/updating tools requires approval"
    - pattern: "config/runtime.yaml"
      decision: auto
      reason: "runtime tuning config"
    - pattern: "config/nodes/**"
      decision: approval_required
      reason: "node definition changes affect execution, prompts, and model selection"
    - pattern: "config/workflows/**"
      decision: approval_required
      reason: "workflow changes affect node graph"
    - pattern: "config/policy.yaml"
      decision: deny
      reason: "policy is high-risk (human-only)"
    # 共享的密钥只经 manage_secret 的虚拟路径写，一次一个键。
    - pattern: "config/secrets.env"
      decision: deny
      reason: "do not allow writing shared dotenv secrets"
    - pattern: "config/models.yaml"
      decision: approval_required
      reason: "config changes require approval"
    # stdio 客户端的 command 会在 reload 后被启动，等价于 config/tools/** 的代码执行风险。
    - pattern: "config/mcp.yaml"
      decision: approval_required
      reason: "mcp stdio clients execute local commands"
    - pattern: "config/tools/**"
      decision: approval_required
      reason: "creating/updating tools requires approval"
    # skill 正文直接进系统提示词。dream 想把高频记忆提升成 skill 会被这条挡下，
    # 要那个功能就把这条连同下面的 skills/** 一起放宽。
    - pattern: "config/skills/**"
      decision: approval_required
      reason: "skill bodies are injected into prompts"
    # 第一个命中的规则赢，所以下面这条兜底必须排在上面几条具体规则之后。
    # config/ 下任何文件都参与决定 engine 怎么跑，落到 default:auto 等于免审批改行为。
    - pattern: "config/**"
      decision: approval_required
      reason: "config changes affect execution"
    # 平台进程的入口脚本。内置默认按各平台描述的 entrypoints 生成，这里照抄 QQ 那条；新平台声明了入口要在这里补上。
    - pattern: "bot.py"
      decision: approval_required
      reason: "qq adapter entrypoint changes require approval"
    - pattern: "adapters/**"
      decision: approval_required
      reason: "adapter source changes require approval"
    - pattern: "clonoth_sdk/**"
      decision: approval_required
      reason: "sdk source changes require approval"
    - pattern: "plugins/**"
      decision: approval_required
      reason: "plugin source changes require approval"
    - pattern: "deploy/**"
      decision: approval_required
      reason: "deployment units run as services"
    # 仓库自带的默认节点和模板，跟代码一起发布；实例要改的写进 config/。
    - pattern: "defaults/**"
      decision: approval_required
      reason: "repository defaults ship with the code"
    # 下面四条是挪进 config/ 之前的位置。判定时新位置也按这些旧名字判一遍，老 policy 给它们写的规则照样生效。
    - pattern: "skills/**"
      decision: approval_required
      reason: "skill bodies are injected into prompts"
    - pattern: "data/config.yaml"
      decision: approval_required
      reason: "config changes require approval"
    - pattern: "data/policy.yaml"
      decision: deny
      reason: "policy is high-risk (human-only)"
    - pattern: "data/mcp_clients.yaml"
      decision: approval_required
      reason: "mcp stdio clients execute local commands"
    - pattern: "data/platform_secrets.yaml"
      decision: deny
      reason: "platform tokens are the instance identity"
    - pattern: "data/events.jsonl"
      decision: deny
      reason: "event log is append-only; never modify"
    - pattern: "data/schedules.yaml"
      decision: approval_required
      reason: "schedule changes require approval"
    - pattern: "engine/**"
      decision: approval_required
      reason: "engine source changes require approval"
    - pattern: "supervisor/**"
      decision: approval_required
      reason: "supervisor source changes require approval"
    - pattern: "toolbox/**"
      decision: approval_required
      reason: "toolbox source changes require approval"
    - pattern: "providers/**"
      decision: approval_required
      reason: "provider source changes require approval"
    - pattern: "shell/**"
      decision: approval_required
      reason: "shell source changes require approval"
    - pattern: "clonoth_runtime.py"
      decision: approval_required
      reason: "runtime lib changes require approval"
    - pattern: "main.py"
      decision: approval_required
      reason: "entrypoint changes require approval"
    - pattern: ".env"
      decision: deny
      reason: "do not allow writing dotenv secrets"
    - pattern: "**/.env"
      decision: deny
      reason: "do not allow writing dotenv secrets"
    # 同上，虚拟路径。写的是 .env 里的单个键，值不经过 supervisor。
    - pattern: ".secret/**"
      decision: auto
      reason: "admins may set api keys via manage_secret"

# 命令执行策略。
# default=approval_required：AI 审核之后，仍需人类审批。
# deny_patterns：硬拦截，命中即拒绝，即使管理员任务也不放行、不发审批。
#   仅用于不可逆破坏 + 极危险的“下载后直接执行 / 反弹 shell”用法。
# sensitive_patterns：敏感但允许“管理员亲自决定”。命中则保持 approval_required 且
#   标记 sensitive，使管理员任务不再自动放行、必须弹审批亲自确认；
#   非管理员的 execute_command 本就被整体拒绝，普通命令（如 curl 纯读取网页不落盘）
#   仍可对管理员免审批直接执行。
execute_command:
  default: approval_required
  deny_patterns:
    - "\\brm\\s+-rf\\s+/"
    - "\\brm\\s+-rf\\s+~"
    - "\\brm\\s+-rf\\s+\\*"
    - "\\bformat\\b"
    - "\\bmkfs\\b"
    - "\\bfdisk\\b"
    - "\\bdd\\s+if=/dev/zero\\b"
    - "\\bshutdown\\b"
    - "\\breboot\\b"
    # 下载后直接管道到 shell/解释器执行（curl ... | sh、wget ... | bash 等）。
    - "(?:curl|wget)\\b[^|]*\\|\\s*(?:sudo\\s+)?(?:sh|bash|zsh|python[0-9.]*|perl|ruby|node)\\b"
    # 反弹 shell。
    - "/dev/tcp/"
    - "\\bbash\\s+-i\\b"
  sensitive_patterns:
    # 下载到本地文件（curl -o/-O/--output、wget、重定向到文件）。
    - "\\bcurl\\b[^|]*(?:\\s-O\\b|\\s-o\\b|--output\\b|--remote-name\\b)"
    - "\\bwget\\b"
    - "(?:curl|wget)\\b[^|<>]*>\\s*\\S+"
    # 包管理器安装（引入外部代码）。
    - "\\bpip[0-9.]*\\s+install\\b"
    - "\\bpipx\\s+install\\b"
    - "\\bnpm\\s+(?:install|i|add)\\b"
    - "\\b(?:pnpm|yarn)\\s+add\\b"
    - "\\b(?:apt|apt-get|yum|dnf|pacman|apk|brew|zypper)\\s+(?:install|add|-S)\\b"
    # 给文件加可执行权限。
    - "\\bchmod\\b[^|]*\\+x\\b"
    # 网络监听（可能开后门）。
    - "\\b(?:nc|ncat|netcat|socat)\\b[^|]*(?:\\s-l\\b|--listen\\b)"
  # 命令里提到这些路径时，按 read_file 对同一路径的档次处理。否则 read_file 拦住了
  # config/models.yaml，一句 cat 就绕过去。read_file 的规则会自动并进来，这里只补工作区
  # 之外的凭据位置；写成 [] 表示关掉这层。
  sensitive_path_patterns:
    - ".ssh/"
    - "id_rsa"
    - "id_dsa"
    - "id_ecdsa"
    - "id_ed25519"
    - ".aws/credentials"
    - ".docker/config.json"
    - ".kube/config"
    - ".netrc"
    - ".git-credentials"
    - ".pgpass"
    - "/etc/shadow"
    - "/etc/sudoers"
    - "/proc/self/environ"

restart:
  default: approval_required
