# Clonoth runtime tuning config
#
# - 本文件可以提交到仓库。
# - 敏感信息应放在环境变量或 config/models.yaml 中。

version: 1

engine:
  max_steps: 64
  streaming: true
  poll_interval_sec: 1.0
  max_workers: 4               # 并发 task 处理数（默认 4）

  compact:
    threshold_tokens: 256000   # 软阈值：超过此值在后台静默压缩，当轮回复照常进行（优先用 LLM 返回的真实值，无则按字符估算）
    hard_threshold_tokens: 0   # 硬阈值：超过此值挂起当轮同步压缩，避免顶爆上下文窗口；0 = 取软阈值的 1.25 倍
    keep_recent_tokens: 30000  # 压缩时保留的原文 token 量，更早的内容压成摘要；0 = 改按 keep_recent 的段数保留
    keep_recent: 6             # keep_recent_tokens 为 0 时生效：保留最近 N 个完整 task 段

  # Child Session 隔离：dispatch 子节点使用独立 session，替代 node_contexts snapshot 机制
  child_session:
    ttl_hours: 24              # child session 不活跃超过此时间后过期
    # Step 2（2026-04-16）：主节点是否也走 ConversationStore，替代 node_contexts snapshot。
    # true  = 主节点入口 task 不再注入 context_ref，history 从 data/conversations/{session_id}.jsonl 加载，
    #        _persist_ctx 不写 snapshot，compact 直接操作 ConversationStore。
    # false = 回退到旧 snapshot 机制（_find_last_context_ref_locked + load_context_snapshot + _persist_node_context）。
    # 灰度切换开关；如出现回归，将此值改为 false 即可回退。
    main_session_enabled: true

  retry:
    max_retries: 3             # LLM 调用失败时最大重试次数（0 = 不重试）
    initial_delay_sec: 1.0     # 首次重试等待秒数
    max_delay_sec: 30.0        # 退避等待上限秒数
    backoff_multiplier: 2.0    # 指数退避倍数
    # 可重试的 HTTP 状态码：429(限流) 500 502 503 504(服务端错误)

  http:
    client_timeout_sec: 60.0

  # Phase 0/1 Signal System：轻量级进程内信号总线配置。
  # bus 在 _run_node_task 中初始化，bridge 将信号写入 data/signals.jsonl。
  signals:
    enabled: true                # false 时 emit 零开销跳过
    bridge_patterns: null        # 可选允许列表；null = 所有信号均可进入 bridge
    # 排除高频流式增量和包含完整工具结果的重复事件；关键完成信息仍由
    # stream_text_final、tool.call.end 及 supervisor events.jsonl 保留。
    bridge_exclude_patterns:
      - stream_delta
      - tool_call_delta
      - tool_call_end

  # 长工具链跑完后，supervisor 另起一个摘要节点给这一轮写摘要
  turn_summary:
    enabled: true
    min_tool_calls: 3                 # 这一轮的工具调用达到此次数才写
    node_id: "system.turn_summarizer"

  tool_mode: json                   # 全局默认工具模式，节点 yaml 可覆盖 (native | json | fake_native)
  output_mode: tool_only            # tool_only = 纯文本回复打回重试；hybrid = 纯文本直接投递给用户。节点 yaml 可覆盖
  plaintext_retry_max: 3            # tool_only 下模型回纯文本时最多重试几次（0-10），用完按隐式 finish 投递

# 每个渠道发给模型的请求参数。options 下的键名由 provider 类自己声明，
# 控制台「模型」页照那份清单渲染；节点 yaml 的 provider_options 会盖掉这里。
providers:
  openai:
    timeout_sec: 600.0
    options: {}
  gemini:
    options:
      thinking_mode: auto
      # 引号不能省：YAML 会把裸 off 读成布尔。Gemini 默认会拦掉不少角色扮演内容，
      # 被拦时回复为空且不报错。
      safety_threshold: "off"

# Capability routing. When an inbound message contains image attachments, the
# supervisor can route it to a vision-capable entry node. Empty entry_node_id
# keeps the original channel entry node.
routing:
  vision:
    # auto：主渠道自己收得下图，或者这个节点没有自己的 model/base_url，都不绕。
    # 后一半是因为空值会回落全局 —— 绕过来还是同一个模型，只是工具和委派没了。
    # true = 一律绕（带图消息碰不到工具，想要这道隔离就写它）；false = 一律不绕。
    enabled: auto
    entry_node_id: "chat.vision"
    # 所有平台默认都用上面这个节点；要按通道（如 qq_group）或平台 id（如 qq）单独指定时再写：
    # channels:
    #   qq_group:
    #     entry_node_id: "chat.vision"

meta:
  execute_command:
    default_timeout_sec: 90.0
    max_output_chars: 12000
    # [2026-07-14] shell 命令超过模型等待预算时应在
    # execute_command 自身的 timeout_sec 下继续运行，而不阻塞推理循环。
    # ai_step 最多等待 threshold_sec（封顶为 timeout_sec 的 80%），随后仅
    # 把 execute_command 转为异步交付，结果通过 async_tool_result / preempt 回传。
    async_upgrade:
      enabled: true
      threshold_sec: 60

  git:
    diff_max_chars: 600000

  search:
    max_file_size_bytes: 3000000

tools:
  script:
    default_timeout_sec: 60.0   # tools/ 下的脚本工具没写 TIMEOUT_SEC 时的超时（1-3600 秒）

skills:
  max_budget_chars: 0       # 0 = no limit; max total chars of skill body to inject

knowledge:
  # 大于 0 时 Skill 和记忆共用这一个预算池按 priority 竞争，skills / memory 各自的
  # max_budget_chars 都不再生效。0 = 各算各的。
  max_budget_chars: 0

memory:
  # 注入记忆的总字数上限。按人加载会一次调出某人的全部档案，不设上限则随档案增长
  # 无边界膨胀。超出时按 priority 降序、同级取更新的保留，constant 条目不参与淘汰。
  # 0 = 不裁剪。
  max_budget_chars: 30000

  auto_extract:
    enabled: true             # true = 入口节点 finish 后由 supervisor 创建记忆提取后置任务
    node_id: "system.memory_extractor"  # 记忆提取节点 id
    min_increment: 6          # 自上次提取后新增消息数达到此值才再次触发
    idle_delay_sec: 30        # 达到 min_increment 后，再空闲此秒数才真正提取（5-120）
    idle_fallback_delay_sec: 60  # 新增消息未达到 min_increment 时，空闲此秒数后仍触发提取（5-3600）

  dream:
    enabled: true             # true = 启用定期记忆整理（dream）
    cron: "0 19 * * *"         # 触发时间，北京时间凌晨 3 点（UTC 19:00）
    node_id: "system.dream"   # 记忆整理节点 id
    organize_profiles: true   # true = 顺带给每份人物档案做一次去重
    # 人物档案专用节点：只有 save_memory / delete_memory，没有 create_or_update_skill。
    # 整理某个人的记忆不该有能力顺手改变 bot 自己的行为。
    profile_node_id: "system.dream_profile"

maintenance:
  # data_cleanup 以前只有 systemd timer 一个入口，Windows 部署上从来没跑过，
  # 记忆 14 天 / 附件 24 小时 / node_contexts 48 小时这些保留策略一条都没生效。
  data_cleanup:
    enabled: true
    cron: "17 * * * *"        # 每小时 17 分，错开整点的其它定时任务
    dry_run: false

shell:
  mode: tui   # tui | cli
  # 以下各项在 TUI 启动时读取，改完重开 TUI 生效
  tui:
    theme: dark               # dark | light，或任一 Textual 内置主题名（如 nord、gruvbox）
    show_thinking: true       # 显示模型的思考过程
    auto_scroll: true         # 新内容到来时滚到底部
    node_panel: false         # 右侧显示节点执行面板
    max_message_height: 50    # 单条消息最多占几行，超出的在消息内部滚动；0 = 不限
  # inbound 未显式带 entry_node_id 时的兜底入口。QQ / TUI 每条 inbound 都自带入口，不受此值影响。
  entry_node_id: "bootstrap.shell_orchestrator"

  http:
    client_timeout_sec: 10.0

  supervisor:
    health_timeout_sec: 2.0
    wait_poll_interval_sec: 0.5

  events_poll_interval_sec: 0.5

supervisor:
  process_manager:
    stop_wait_timeout_sec: 5.0
    shell_new_console: false
    engine_workers: 2
    spawn_shell_cli: false    # supervisor 启动时顺带拉起 shell；环境变量 CLONOTH_SPAWN_SHELL_CLI 优先
