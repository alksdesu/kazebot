# 平台密钥示例。复制成工作区的 data/platform_secrets.yaml 再按需填写。
#
# 各聊天平台的连接令牌和密钥按平台 id 分段，比 .env 里对应的变量优先；
# 两处都写且不一样时，启动日志会提醒 .env 那个没生效。支持 ${VAR} 引用 .env。
# 平台不认识的键同样会在启动时报出来，免得拼错了还以为配上了。
# 这些是实例身份，放 data/ 而不放 config/：config/ 可能整份共享给别的实例。

# qq:
#   access_token: "${ONEBOT_ACCESS_TOKEN}"   # NapCat 连接令牌，NapCat 侧配了就填同一个值
#   forward_bridge_token: "..."              # 转发 Bridge 令牌；都没配时 bot 自签到 data/onebot_forward_bridge_token
#   conversation_hash_secret: "..."          # 会话键摘要密钥；改动会让已有会话映射全部失配
#   napcat_webui_token: "..."                # NapCat WebUI 令牌，控制台扫码和切号用；部署脚本会回填进 .env
