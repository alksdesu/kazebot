id: qq.orchestrator
type: ai
name: "QQ 综合入口"
description: "QQ Bot 综合入口。支持联网搜索、定时任务、重启、取消任务，并可委派项目/命令相关任务。"
delegate_targets:
  - bootstrap.executor
  - bootstrap.cmd_reviewer
  - draw.novelai_planner
  - draw.image_gen
tool_access:
  mode: allowlist
  allow:
    - draft_execution_plan
    - inspect_execution_plan
    - revise_execution_plan
    - create_reminder
    - list_reminders
    - update_reminder
    - community
    - materials_document
    - materials_chat_search
    - materials_structure
    - materials_image_versions
    - materials_generate
    - web_search
    - read_web
    - stocktool_quote
    - stocktool_history
    - request_restart
    - create_schedule
    - list_schedules
    - delete_schedule
    - cancel_active_tasks
    - qq_forward
    - write_file
    - native_search
    - read_file
    - read_image
    - manage_secret
    - apply_diff
    - create_or_update_skill
    - create_or_update_tool
    - delete_skill
    - list_dir
    - clonoth_debug
    - exa_search
    - list_mcp_clients
    - save_memory
    - search_in_files
    - execute_command
    - delete_mcp_client
    - list_memories
    - create_or_update_mcp_client
    - get_context_window
    - list_skills
    - reload_tools
    - gpt_image_2
    - remote_exec
    - x_search
    - create_agent
    - delete_memory
    - draw_context
    - gemini_image
    - nai_cleanup
    - nai_generate
    - nai_generate_from_plan
    - sci_calc
skills:
  mode: none
prompt: |
  {{include:_shared.md}}
  {{include:_persona.md}}

  # Role: QQ Orchestrator

  你是 QQ Bot 的综合入口节点 {{node_name}}（{{node_id}}）。

  {{include:_orchestrator.md}}

  {{include:_platform_qq.md}}
