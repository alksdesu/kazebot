# QQ 适配层热载配置。复制成 config/qq.yaml 后改哪一项都不用重启 bot 进程。
#
# 取值优先级：本文件 > config/features.yaml > 环境变量 > 内置默认。写在这里的键会盖掉
# 全局文件和 .env 里的同名设置，所以只保留你真的要接管的键，其余整行删掉或注释掉。
#
# 这里只列 QQ 独有的键。触发、审批、复读、收图收文件、队列、群历史、表情包挑图这些
# 全平台共用的设置写在 config/features.yaml（模板是 config/features.example.yaml），
# 要让 QQ 单独用另一套值，在本文件写同样的路径即可；表情包图库那五项全平台只有一份，只认全局文件。
#
# 每个键的解析规则、环境变量兜底和生效方式都声明在 adapters/onebot/live_config.py 的
# LIVE_KEYS 里；GET /qq/state 返回 bot 进程当前实际生效的值，改完对着它确认。

version: 1

# ── 信道：能在哪些群说话、谁能私聊 ──────────────
channels:
  # 空列表 = 不在任何群说话。未配置时的默认状态就是空，这是刻意的 fail-closed。
  allowed_groups: []
  #   - 123456789
  allowed_private_users: []
  #   - 10001
  # 已通过好友请求的人是否自动放行私聊。
  allow_private_friends: true
  # 未放行的人私聊时回什么。留空 = 一个字都不回，不向陌生人确认这个号是 bot。
  private_denied_reply: ""

# ── 权限 ──────────────────────────────────────
permissions:
  # 空列表 = 所有管理命令不可用，且每个审批请求都会被自动拒绝。
  admin_users: []
  #   - 10001

  # 每项能力授予到哪一档：
  #   off          谁都不能用，名单里的人也一样
  #   admin        只有上面那份名单（默认）
  #   owner        名单 + 本群群主
  #   group_admin  名单 + 本群群主 + 本群管理员
  # 群角色由 OneBot 上报，只在群消息里成立 —— 群主在私聊里就是个普通用户。
  # 前七项影响面超出单个群或会泄露真实号（改全局配置、借 bot 身份发给任意人、
  # 投递死信清单带真实群号/QQ 号、整理全部会话与人物档案），写 owner 会被夹回 admin。
  capabilities:
    approval: admin
    model: admin
    draw_preset: admin
    custom_face: admin
    cross_session: admin
    send_dead_letter: admin
    dream: admin
    # 这两项能给到群主/群管，但目标会被夹在他自己那个群里。
    clear_memory: admin
    proactive: admin

# ── 开口时机 ──────────────────────────────────
# 触发规则写在 config/features.yaml 的 trigger 下。「名字」信号由 bot 自己匹配，不要再配
# NoneBot 的 NICKNAME：那个命中后会把名字从正文里删掉，AI 和群历史看到的是「你好」而不是
# 「咪啪你好」，点名这个信号在进模型前就丢了（配了启动时会告警）。

# ── 输出格式 ──────────────────────────────────
output:
  # 剥掉 *斜体* / **粗体** 的星号。
  strip_asterisk_styles: true
  # 下划线默认不当 Markdown，否则 PUB_CACHE、user_id、_literal_ 会被改写。
  strip_underscore_styles: false
  message_limit: 4300
  # 注入给模型的收藏表情名上限，0 = 不注入。
  face_prompt_limit: 50
  # 多图合并成一条转发发出。默认关：合并转发会长时间占住那条唯一的反向 WS，
  # 期间这个 bot 的发消息、贴表情全部排队。出问题时把它关掉即时生效。
  image_forward_merge: false
  # 至少几张图才走合并，少于这个数继续逐张直发。
  image_forward_merge_threshold: 2

# ── 扩展能力 ──────────────────────────────────
extensions:
  # 任务阶段用 QQ 表情反馈：submitted 281 → thinking 178 → tool 97 → writing 326，收尾全部摘掉。
  reactions: true
  auto_like: false
  auto_like_times: 10
  # 把群里的表情包攒进图库。图库本身（入库、打标、上限）和挑图发图写在 config/features.yaml，
  # 这里只管从 QQ 收不收、收多严、从哪些群收。
  sticker:
    collect: false
    # strict 只收 QQ 标了表情包的；loose 再放行看着不像截图的；none 全收
    strategy: loose
    groups: []              # 只从这些群收，留空表示所有已授权的群
    # 表情名同时对得上收藏表情和图库时先用哪个：native_first 收藏表情，library_first 图库
    lookup_order: native_first

# ── 输入能力 ──────────────────────────────────
# 收图、收文件的开关和上限写在 config/features.yaml 的 input 下，这里只管合并转发怎么展开。
# 事件里带的本机绝对路径另有一道闸：默认只读工作区内，放开要配
# ONEBOT_LOCAL_SOURCE_ROOTS（不是热载键，改了要重启）。
input:
  forward_msg: true
  forward_msg_max_depth: 3
  forward_msg_max_messages: 80
  forward_msg_text_limit: 12000
  # 展开一条消息里全部转发卡片的总时限。超时按没展开处理，正文只剩占位符。
  forward_msg_timeout_sec: 8.0
  # 群触发判定要不要看展开后的正文。关掉后转发消息得 @ 或回复才理，关键词判不中。
  forward_msg_expand_for_trigger: true
  # 转发卡片里的图片和文件一并采集，条数仍受 max_images_per_turn / max_files_per_turn 限制。
  forward_msg_media: true

# ── 自然语言转发 Bridge ───────────────────────
forward_bridge:
  enabled: true
  max_messages: 30
  # 监听地址与令牌不在这里：ONEBOT_FORWARD_BRIDGE_HOST/PORT 和令牌在启动时绑定，改了要重启。
  # 令牌写在 data/config.yaml 的 platforms.qq.forward_bridge_token 或 .env 的 ONEBOT_FORWARD_BRIDGE_TOKEN；
  # 都没配时 bot 自签一份写到 ONEBOT_FORWARD_BRIDGE_TOKEN_FILE
  # （默认 ${CLONOTH_WORKSPACE}/data/onebot_forward_bridge_token），仍强制校验；文件不可写则 Bridge 不启动。
